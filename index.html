<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>PT Auto Mitra Utama — Sistem Internal</title>

<link rel="icon" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">
<link rel="stylesheet" href="./css/style.css?v=1.0.6">
</head>
<body>

<!-- Layar muat: tampil sampai status login diketahui -->
<div id="muat" class="muat">
  <div class="muat-isi">
    <div class="logo-ubin">
      <img class="logo" src="./logo.png" alt="Logo PT Auto Mitra Utama"
           onerror="this.hidden=true;this.nextElementSibling.hidden=false">
      <svg class="logo" viewBox="0 0 72 72" hidden aria-hidden="true">
        <rect x="2" y="2" width="68" height="68" rx="17" fill="#0071E3"/>
        <circle cx="24" cy="47" r="7.5" fill="none" stroke="#fff" stroke-width="3.2"/>
        <circle cx="50" cy="47" r="7.5" fill="none" stroke="#fff" stroke-width="3.2"/>
        <path d="M17 47c-1-9 2-16 8-19l9-3 6 9h8c4 0 7 3 7 7v6"
              fill="none" stroke="#fff" stroke-width="3.2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="muat-nama">PT AUTO MITRA UTAMA</p>
    <div class="muat-bar"><span></span></div>
  </div>
</div>

<!-- ── Layar masuk ─────────────────────────────────────────── -->
<div id="layar-masuk" class="masuk">
  <div class="masuk-isi">
    <img class="masuk-logo" src="./logo.png" alt=""
         onerror="this.hidden=true">
    <p class="eyebrow">Sistem internal</p>
    <h1 id="nama-showroom" class="masuk-nama">PT Auto Mitra Utama</h1>

    <form id="form-masuk" class="masuk-form" autocomplete="on">
      <label class="label" for="email">Email</label>
      <input class="isian" id="email" type="email"
             autocomplete="username">

      <label class="label" for="sandi">Kata sandi</label>
      <input class="isian" id="sandi" type="password"
             autocomplete="current-password" placeholder="••••••••">

      <button class="tombol tombol--utama" id="tombol-masuk" type="submit">
        Masuk
      </button>
    </form>

  </div>
  <footer class="kaki">
    <span id="versi">v1.0.0</span>
    <span data-merek>©SRISP 2026</span>
  </footer>
</div>

<!-- ── Aplikasi ────────────────────────────────────────────── -->
<div id="aplikasi" class="aplikasi" hidden>

  <!-- Sidebar: menu berubah mengikuti peran -->
  <aside id="sisi" class="sisi">
    <div class="sisi-merek">
      <img class="sisi-logo" src="./logo.png" alt=""
           onerror="this.replaceWith(Object.assign(document.createElement('span'),
                    {className:'lampu lampu--sein'}))">
      <span id="sisi-nama">PT Auto Mitra Utama</span>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sisi-kaki">
      <span id="sisi-versi">v1.0.4</span>
      <span data-merek>©SRISP 2026</span>
    </div>
  </aside>

  <div class="utama">
    <header class="panel">
      <div class="panel-baris">
        <button class="hamburger" id="buka-sisi" type="button"
                aria-label="Buka menu">
          <span></span><span></span><span></span>
        </button>
        <div class="panel-teks">
          <span id="label-peran" class="panel-peran">Peran</span>
          <span id="nama-pengguna" class="panel-nama">Pengguna</span>
        </div>
        <span id="lampu-peran" class="lampu lampu--sein"></span>
        <button class="tombol tombol--sunyi" id="tombol-keluar" type="button">
          Keluar
        </button>
      </div>
      <div class="panel-baca">
        <span id="batas-diskon" class="baca">Batas diskon</span>
        <span id="penanda-uji" class="tanda tanda--uji" hidden>Data uji</span>
      </div>
      <div id="status-koneksi" class="pita-luring" hidden>
        Tanpa koneksi — pekerjaan tersimpan di HP, terkirim saat sinyal kembali
      </div>
    </header>

    <main id="konten" class="konten"></main>
  </div>

  <div id="tirai" class="tirai" hidden></div>
</div>

<div id="publik" class="publik" hidden></div>

<div id="dialog-wadah" class="dialog-wadah" hidden></div>

<div id="kabar" class="kabar-wadah" aria-live="polite"></div>

<script type="module" src="./js/app.js?v=1.0.6"></script>
</body>
</html>
